<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — Selfinity</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#834CCA">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #F5F3FF;
            --bg-secondary: #FFFFFF;
            --text-primary: #1A1921;
            --text-secondary: #4A4655;
            --accent-start: #834CCA;
            --accent-end: #9D92FF;
            --border-color: #E9E0F6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #171426;
                --bg-secondary: #0C0A14;
                --text-primary: #E6E4F2;
                --text-secondary: #C9C6D6;
                --accent-start: #9D92FF;
                --accent-end: #B9A6FF;
                --border-color: #231F3A;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            line-height: 1.7;
            color: var(--text-primary);
            background: var(--bg-secondary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .lost {
            background: var(--bg-primary);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(131, 76, 202, 0.14);
            padding: 48px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
        }

        .mascot {
            width: 140px;
            height: auto;
            margin-bottom: 8px;
        }

        .code {
            font-family: 'Manrope', 'Nunito', sans-serif;
            font-size: clamp(3.5rem, 14vw, 5.5rem);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent-start) 0%, var(--accent-end) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-family: 'Manrope', 'Nunito', sans-serif;
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            margin: 10px 0 10px;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        .btn {
            font-family: 'Manrope', 'Nunito', sans-serif;
            display: inline-block;
            padding: 14px 34px;
            background: linear-gradient(90deg, #8C52FF 0%, #9D92FF 100%);
            color: white;
            border-radius: 28px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(131, 76, 202, 0.30);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(131, 76, 202, 0.45);
        }

        @media (max-width: 560px) {
            .lost {
                padding: 36px 24px;
                border-radius: 20px;
            }
        }
    </style>
</head>

<body>
    <main class="lost">
        <img class="mascot" src="images/mascot_wanderer.png" alt="">
        <div class="code">404</div>
        <h1>This page wandered off.</h1>
        <p>Aradığınız sayfa bulunamadı. · The page you were looking for isn't here. · No encontramos la página que
            buscabas.</p>
        <a class="btn" href="/">Ana sayfa · Home · Inicio</a>
    </main>
</body>

</html>
